syntax = "proto3";

// LuckyEngine gRPC API (v1) — client-side schema for the LuckyRobots SDK.
//
// These .proto files describe the surface the engine SERVES; the SDK is a client of it. The
// definitive schema lives with the engine, and this tree mirrors it — so treat these files as
// generated-from-upstream rather than as the place to design a new RPC. The Python stubs under
// `luckyrobots/grpc/generated/` are compiled from exactly these files; regenerate them whenever a
// file here changes, or the stubs and the schema drift apart silently.
//
// Compatibility note:
// - Avoid renumbering existing field tags (the `= N` numbers). Add new fields with new tags instead.
//   An engine built against the old numbering will otherwise mis-parse a client that uses the new one.

package hazel.rpc;

option cc_enable_arenas = true;

// This file is an umbrella entrypoint for the full API. The canonical message/service
// definitions live in smaller domain-specific protos for readability.

import "common.proto";
import "scene.proto";
import "mujoco.proto";
import "telemetry.proto";
import "media.proto";
import "agent.proto";
import "viewport.proto";
import "camera.proto";
import "debug.proto";
